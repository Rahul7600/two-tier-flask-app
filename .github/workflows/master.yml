name: Docker Build and Push with AIOps

on:
  push:
    branches:
      - master

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    # ----------------------------------------
    # Step 1: Checkout code
    # ----------------------------------------
    - name: Checkout code
      uses: actions/checkout@v3

    # ----------------------------------------
    # Step 2: Login to Docker Hub
    # ----------------------------------------
    - name: Log in to Docker Hub
      uses: docker/login-action@v2
      with:
        username: ${{ secrets.DOCKER_USERNAME }}
        password: ${{ secrets.DOCKER_PASSWORD }}

    # ----------------------------------------
    # Step 3: Build Docker image (capture logs)
    # ----------------------------------------
    - name: Build Docker image
      run: |
        docker build . -t flaskapp 2>&1 | tee docker-build.log

    # ----------------------------------------
    # Step 4: Tag Docker image
    # ----------------------------------------
    - name: Tag Docker image
      run: |
        docker tag flaskapp rahul7600/flaskapp:v1

    # ----------------------------------------
    # Step 5: Push Docker image (capture logs)
    # ----------------------------------------
    - name: Push Docker image
      run: |
        docker push rahul7600/flaskapp:v1 2>&1 | tee docker-push.log

    # ========================================
    # 🤖 AIOps: AI Failure Analysis (REAL LOGS)
    # ========================================
    - name: 🤖 AI Analyze Pipeline Failure
      if: failure()
      continue-on-error: true
      env:
        OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      run: |
        echo "🤖 AI is analyzing GitHub Actions failure..."

        # Combine Docker logs safely
        LOGS=$(cat docker-build.log docker-push.log 2>/dev/null || echo "No Docker logs found")

        # Build SAFE JSON payload using jq
        JSON_PAYLOAD=$(jq -n \
          --arg logs "$LOGS" \
          '{
            model: "gpt-4.1-mini",
            messages: [
              {
                role: "system",
                content: "You are a senior DevOps engineer."
              },
              {
                role: "user",
                content: ("Analyze this GitHub Actions Docker CI failure and suggest the exact root cause and fix:\n" + $logs)
              }
            ]
          }')

        # Call OpenAI API (correct header, no extra quotes)
        curl -s https://api.openai.com/v1/chat/completions \
          -H "Authorization: Bearer $OPENAI_API_KEY" \
          -H "Content-Type: application/json" \
          -d "$JSON_PAYLOAD"
