name: Docker Build and Push with AIOps

on:
  push:
    branches:
      - master

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v3

    - name: Docker Login
      uses: docker/login-action@v2
      with:
        username: ${{ secrets.DOCKER_USERNAME }}
        password: ${{ secrets.DOCKER_PASSWORD }}

    - name: Build Docker image
      run: |
        set +e
        docker build . -t flaskapp 2>&1 | tee docker-build.log
        BUILD_EXIT_CODE=${PIPESTATUS[0]}
        exit $BUILD_EXIT_CODE

    - name: Tag Docker image
      run: |
        docker tag flaskapp rahulray760/flaskapp:v1

    - name: Push Docker image
      run: |
        set +e
        docker push rahulray761/flaskapp:v1 2>&1 | tee docker-push.log
        PUSH_EXIT_CODE=${PIPESTATUS[0]}
        exit $PUSH_EXIT_CODE

    - name: Upload Docker logs
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: docker-logs
        path: |
          docker-build.log
          docker-push.log

    - name: 🤖 AI Analyze Pipeline Failure
      if: failure()
      continue-on-error: true
      env:
        OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      run: |
        echo "🤖 AI is analyzing GitHub Actions failure..."

        LOGS=$(cat docker-build.log docker-push.log 2>/dev/null || echo "No Docker logs found")

        JSON_PAYLOAD=$(jq -n \
          --arg logs "$LOGS" \
          '{
            model: "gpt-4.1-mini",
            messages: [
              { role: "system", content: "You are a senior DevOps engineer." },
              { role: "user", content: ("Analyze this Docker CI failure and give exact root cause and fix:\n" + $logs) }
            ]
          }')

        curl -s https://api.openai.com/v1/chat/completions \
          -H "Authorization: Bearer $OPENAI_API_KEY" \
          -H "Content-Type: application/json" \
          -d "$JSON_PAYLOAD"
