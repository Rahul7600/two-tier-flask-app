name: Docker Build and Push with AIOps

on:
  push:
    branches:
      - master

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    # ----------------------------------------
    # Step 1: Checkout code
    # ----------------------------------------
    - name: Checkout code
      uses: actions/checkout@v3

    # ----------------------------------------
    # Step 2: Login to Docker Hub
    # ----------------------------------------
    - name: Log in to Docker Hub
      uses: docker/login-action@v2
      with:
        username: ${{ secrets.DOCKER_USERNAME }}
        password: ${{ secrets.DOCKER_PASSWORD }}

    # ----------------------------------------
    # Step 3: Build Docker image
    # ----------------------------------------
    - name: Build Docker image
      run: |
        docker build . -t flaskapp

    # ----------------------------------------
    # Step 4: Tag Docker image
    # ----------------------------------------
    - name: Tag Docker image
      run: |
        docker tag flaskapp rahul7600/flaskapp:v1

    # ----------------------------------------
    # Step 5: Push Docker image
    # ----------------------------------------
    - name: Push Docker image
      run: |
        docker push rahul7600/flaskapp:v1

    # ========================================
    # 🤖 AIOps: AI Failure Analysis (CORRECT)
    # ========================================
    - name: 🤖 AI Analyze Pipeline Failure
      if: failure()
      continue-on-error: true
      env:
        OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      run: |
        echo "🤖 AI is analyzing GitHub Actions failure..."

        LOGS="Docker CI failed.
        Repository: $GITHUB_REPOSITORY
        Branch: $GITHUB_REF_NAME
        Commit: $GITHUB_SHA
        Step: Docker build or push"

        # Create safe JSON payload
        JSON_PAYLOAD=$(jq -n \
          --arg logs "$LOGS" \
          '{
            model: "gpt-4.1-mini",
            messages: [
              { role: "system", content: "You are a senior DevOps engineer." },
              { role: "user", content: ("Analyze this GitHub Actions Docker CI failure and suggest root cause and fix:\n" + $logs) }
            ]
          }')

        # Call OpenAI API (NO extra quotes)
        curl -s https://api.openai.com/v1/chat/completions \
          -H "Authorization: Bearer $OPENAI_API_KEY" \
          -H "Content-Type: application/json" \
          -d "$JSON_PAYLOAD"
